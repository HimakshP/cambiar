[package]
name = "cambiar"
version = "0.1.0"
edition = "2024"
description = "A lightweight CLI for converting between common file formats"
license = "MIT"
repository = "https://github.com/HimakshP/cambiar"
readme = "README.md"
keywords = ["cli", "converter", "file-converter", "rust"]
categories = ["command-line-utilities"]

[dependencies]
assert_cmd = "2.2.2"
clap = {version = "4", features = ["derive"]}
csv = "1.4.0"
flamegraph = "0.6.13"
htmd = "0.5.4"
image = "0.25.10"
predicates = "3.1.4"
pulldown-cmark = "0.13.4"
serde = "1.0.228"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "csv_json"
harness = false

[profile.release]
debug = true